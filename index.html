<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Foto-scan24.de — Mediendigitalisierung</title>
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

  <!-- eyecatcher -->
  <div id="section-eyecatcher"></div>

  <script>
    // Abschnitte dynamisch laden
    const sections = [
      { id: 'section-eyecatcher', file: 'sections/eyecatcher.html' },
    ];
    sections.forEach(({ id, file }) => {
      fetch(file)
        .then(r => r.text())
        .then(html => { document.getElementById(id).outerHTML = html; });
    });
  </script>

  </footer>

</body>
</html>
